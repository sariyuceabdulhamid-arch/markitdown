name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not passed to pull requests from forks.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          # Set either secret: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, Pro/Max plan) or ANTHROPIC_API_KEY.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Only comment on lines this pull request changes.

            Look for:
            - Correctness bugs and regressions in converters, including non-ASCII text, empty or malformed files, and missing optional dependencies.
            - Security issues: unsafe file or URL handling, path traversal, untrusted input reaching shell commands.
            - Changes to the public Python API, CLI flags, or MCP server behavior that are not called out in the PR description.
            - Missing or weakened tests for changed behavior.
            - Comments or docs the change made stale.

            Post each finding as an inline comment with mcp__github_inline_comment__create_inline_comment.
            Then post one short summary with `gh pr comment`. If there are no findings, say so in one line.
            Do not comment on formatting that Black already enforces.
          claude_args: |
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
